        display: flex;

        justify-content: flex-end;

        align-items: center;
    }


    .quantity-cell::before {

        font-size: 10px;

        color: #8997a2;

        margin-right: 8px;
    }

        font-size: 23px;

`;

document.head.appendChild(style);


/* =========================================================
   RENDER MEDICINES
   ========================================================= */

const tableBody = document.getElementById("medicineTableBody");


function renderMedicines(list = products) {

    tableBody.innerHTML = "";

    list.forEach((medicine, index) => {

        const row = document.createElement("tr");

        if (medicine.qty > 0) {
            row.classList.add("added");
        }

        if (!medicine.code && !medicine.name && !medicine.offer) {
            row.classList.add("empty-row");
        }


        row.innerHTML = `

            <td class="code">
                ${escapeHTML(medicine.code)}
            </td>

            <td class="medicine-name">
                ${medicine.name
                    ? escapeHTML(medicine.name)
                    : "Empty product slot"
                }
            </td>

            <td class="offer">
                ${medicine.offer
                    ? escapeHTML(medicine.offer)
                    : "-"
                }
            </td>

            <td class="quantity-cell">

                <div class="quantity-box">

                    <button
                        class="qty-btn minus-btn"
                        onclick="changeQuantity(${index}, -1)"
                        aria-label="Decrease quantity"
                    >
                        −
                    </button>

                    <span class="qty-number">
                        ${medicine.qty}
                    </span>

                    <button
                        class="qty-btn plus-btn"
                        onclick="changeQuantity(${index}, 1)"
                        aria-label="Increase quantity"
                    >
                        +
                    </button>

                </div>

                ${
                    medicine.qty > 0
                    ? `<span class="added-label">✅ Added</span>`
                    : ""
                }

            </td>
        `;


        tableBody.appendChild(row);

    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

}


/* =========================================================
   CHANGE QUANTITY
   ========================================================= */

function changeQuantity(index, amount) {

    const medicine = products[index];

    medicine.qty += amount;

    if (medicine.qty < 0) {
        medicine.qty = 0;
    }

    updateCart();

    renderMedicines(getFilteredMedicines());

}


/* =========================================================
   CART COUNT
   ========================================================= */

function getTotalItems() {

    return products.reduce(
        (total, medicine) => total + medicine.qty,
        0
    );

}


function updateCart() {

    const total = getTotalItems();

    document.getElementById("cartCount").textContent =
        `🛒 Cart: ${total} Items Selected`;

    document.getElementById("buttonCount").textContent =
        total;

}


/* =========================================================
   SEARCH
   ========================================================= */

function getFilteredMedicines() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    if (!search) {
        return products;
    }


    return products.filter(medicine => {

        return (
            medicine.code.toLowerCase().includes(search) ||
            medicine.name.toLowerCase().includes(search)
        );

    });

}


document
    .getElementById("searchInput")
    .addEventListener("input", function () {

        renderMedicines(getFilteredMedicines());

    });


/* =========================================================
   WHATSAPP ORDER
   ========================================================= */

document
    .getElementById("whatsappOrderBtn")
    .addEventListener("click", function () {

        const selectedItems =
            products.filter(
                medicine => medicine.qty > 0
            );


        if (selectedItems.length === 0) {

            alert(
                "Please select at least one product before sending the order."
            );

            return;
        }


        const totalItems =
            getTotalItems();


        let message =
`Assalam-o-Alaikum Ghousia Pharma...

New Product Order 🛒:

`;


        selectedItems.forEach((medicine, index) => {

            message +=
`${index + 1}. ${medicine.name.replace(
    /[^\x00-\x7F]/g,
    ""
).trim()} (Code: ${medicine.code}) - Qty: ${medicine.qty} - Offer: ${medicine.offer}
`;

        });


        message +=
`
Total Items: ${totalItems}`;


        const whatsappURL =
            "https://wa.me/923412859319?text=" +
            encodeURIComponent(message);


        window.open(
            whatsappURL,
            "_blank"
        );

    });


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderMedicines();

updateCart();

</script>

</body>
</html>
